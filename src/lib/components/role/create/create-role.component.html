<default-actions
  (save)="save()"
  [disabled]="{
    save: formGroup.invalid
  }"
></default-actions>
<div class="main-content">
  <form novalidate autocomplete="off" [formGroup]="formGroup">
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <strong>Create a Role</strong>
          </div>
          <div class="card-body">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Name</label>
                <input validate formControlName="name" class="form-control" placeholder="e.g. admin, editor" noWhiteSpace required/>
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Display Name</label>
                <input validate formControlName="displayName" class="form-control" placeholder="e.g. Administrator, Content Editor" required />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Description</label>
                <textarea validate formControlName="description" class="form-control" rows="3" placeholder="Describe what this role can do..." required></textarea>
              </with-validation>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
