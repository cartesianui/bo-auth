<page-title [title]="'Permissions'"></page-title>
<page-actions (searchChange)="onSearch($event)"></page-actions>

<app-offcanvas id="permissions-forms" title="Permission Detail" [visible]="childSelected" (visibleChange)="hideChildComponent($event)">
  <auth-permission-detail *ngIf="isComponentSelected(childComponents.permissionDetails)"/>
</app-offcanvas>

<div class="main-content dt" #dtContainer>
  <div class="row">
    <div class="col-md-12 my-2">
      <span class="float-end">Total: {{ sb.permission.pagination()?.total }}</span>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <app-datatable
        [rows]="sb.permission.entities()"
        [columns]="columns"
        [headers]="headers"
        [count]="sb.permission.pagination()?.total"
        [offset]="getOffsetFromPagination()"
        [limit]="sb.permission.pagination()?.perPage"
        [selected]="selected"
        (selectChange)="onSelect($event)"
        (pageChange)="setPage($event)"
        (editClick)="view($event)"
      ></app-datatable>
    </div>
  </div>
</div>
